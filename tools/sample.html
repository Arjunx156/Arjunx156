<!doctype html>
<meta charset="utf-8" />
<title>sample</title>
<!-- Draws "Arjun" and "hello" in nine scripts and samples each into particle targets.
     Same sampler as the portfolio hero: 40% of points trace edges so letters stay crisp.
     Run through headless Chrome; the JSON lands in <pre id="out">. -->
<pre id="out"></pre>
<script type="module">
  const SCRIPTS = [
    ["English", "Arjun", "Hello", "Mona Sans", "mona-sans"],
    ["Malayalam", "അർജുൻ", "നമസ്കാരം", "N Malayalam", "malayalam"],
    ["Hindi", "अर्जुन", "नमस्ते", "N Devanagari", "devanagari"],
    ["Tamil", "அர்ஜுன்", "வணக்கம்", "N Tamil", "tamil"],
    ["Telugu", "అర్జున్", "నమస్కారం", "N Telugu", "telugu"],
    ["Kannada", "ಅರ್ಜುನ್", "ನಮಸ್ಕಾರ", "N Kannada", "kannada"],
    ["Bengali", "অর্জুন", "নমস্কার", "N Bengali", "bengali"],
    ["Gujarati", "અર્જુન", "નમસ્તે", "N Gujarati", "gujarati"],
    ["Punjabi", "ਅਰਜੁਨ", "ਸਤ ਸ੍ਰੀ ਅਕਾਲ", "N Gurmukhi", "gurmukhi"],
  ];
  const params = new URLSearchParams(location.search);
  const COUNT = Number(params.get("count") ?? 900);
  const W = 1200, H = 420, BOX_W = 1080, BOX_H = 300, STEP = 2, EDGE_SHARE = 0.4;

  function random(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function sample(family, weight, text, seed) {
    const c = document.createElement("canvas");
    c.width = W;
    c.height = H;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.font = `${weight} 220px "${family}"`;
    const m = g.measureText(text);
    const size = 220 * Math.min(
      BOX_W / (m.actualBoundingBoxLeft + m.actualBoundingBoxRight),
      BOX_H / (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent),
    );
    g.font = `${weight} ${size}px "${family}"`;
    const f = g.measureText(text);
    const x0 = (W - (f.actualBoundingBoxLeft + f.actualBoundingBoxRight)) / 2 + f.actualBoundingBoxLeft;
    const y0 = (H - (f.actualBoundingBoxAscent + f.actualBoundingBoxDescent)) / 2 + f.actualBoundingBoxAscent;
    g.fillStyle = "#fff";
    g.fillText(text, x0, y0);
    const data = g.getImageData(0, 0, W, H).data;
    const on = (x, y) => x >= 0 && y >= 0 && x < W && y < H && data[(y * W + x) * 4 + 3] > 127;
    const fill = [], edge = [];
    for (let y = 0; y < H; y += STEP)
      for (let x = 0; x < W; x += STEP) {
        if (!on(x, y)) continue;
        const isEdge = !on(x - STEP, y) || !on(x + STEP, y) || !on(x, y - STEP) || !on(x, y + STEP);
        (isEdge ? edge : fill).push([x, y]);
      }
    const rand = random(seed);
    const pick = (list) => list[Math.floor(rand() * list.length)];
    const edges = Math.round(COUNT * EDGE_SHARE);
    const pts = [];
    for (let i = 0; i < COUNT; i++) {
      const onEdge = i < edges && edge.length > 0;
      const [px, py] = pick(onEdge ? edge : fill);
      const j = onEdge ? 0.6 : STEP;
      pts.push([+(px + (rand() - 0.5) * j).toFixed(1), +(py + (rand() - 0.5) * j).toFixed(1), onEdge ? 1 : 0]);
    }
    return pts;
  }

  for (const [, , , family, file] of SCRIPTS) {
    const face = new FontFace(family, `url(fonts/${file}.woff2) format("woff2")`, { weight: file === "mona-sans" ? "200 900" : "700" });
    document.fonts.add(await face.load());
  }
  const out = SCRIPTS.map(([lang, word, hello, family, file], k) => {
    const weight = file === "mona-sans" ? 800 : 700;
    return { lang, word, hello, name: sample(family, weight, word, 17 + k), greet: sample(family, weight, hello, 91 + k) };
  });
  document.getElementById("out").textContent = JSON.stringify({ width: W, height: H, scripts: out });
</script>

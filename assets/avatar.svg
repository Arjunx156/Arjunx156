<svg width="1600" height="540" viewBox="0 0 1600 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1460" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1119"/>
      <stop offset="0.55" stop-color="#111A27"/>
      <stop offset="1" stop-color="#18251F"/>
    </linearGradient>
    <linearGradient id="skin" x1="736" y1="157" x2="878" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3C5A7"/>
      <stop offset="1" stop-color="#B86F5D"/>
    </linearGradient>
    <linearGradient id="shirt" x1="708" y1="372" x2="935" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F16D"/>
      <stop offset="1" stop-color="#8CA73F"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#C9D3D8" stroke-opacity="0.07"/>
    </pattern>
    <style>
      .orbit { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
      .orbit-reverse { transform-box: fill-box; transform-origin: center; animation: spin-reverse 24s linear infinite; }
      .float-a { animation: float-a 5s ease-in-out infinite; }
      .float-b { animation: float-b 6s ease-in-out infinite; }
      .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes float-a { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes float-b { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(11px); } }
      @keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(0.08); } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .orbit-reverse, .float-a, .float-b, .blink { animation: none; }
      }
    </style>
  </defs>

  <rect width="1600" height="540" rx="28" fill="url(#bg)"/>
